name: Deploy to Firebase Hosting and Functions on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # Install Firebase Tools globally
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Install dependencies for functions
      - name: Install Functions Dependencies
        run: cd functions && npm ci

      # Deploy everything (Hosting + Functions + Rules)
      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAKEDBYBOSTIK_5EB55 }}' > /tmp/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json
          firebase deploy --project bakedbybostik-5eb55 --non-interactive
